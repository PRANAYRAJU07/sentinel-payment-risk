name: ML Pipeline CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ml/**'
      - 'scripts/**'
      - '.github/workflows/ml.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ml/**'

jobs:
  validate:
    name: ML Pipeline Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        working-directory: ml
        run: pip install -r requirements.txt

      - name: Lint ML code
        run: |
          pip install ruff black
          ruff check ml/src/
          black --check ml/src/

      - name: Run ML unit tests (no dataset download)
        run: |
          pytest ml/tests/ -v -m "not requires_dataset"
        env:
          KAGGLE_USERNAME: ""
          KAGGLE_API_TOKEN: ""
          # NOTE: Dataset download is NOT run in CI
          # Dataset must be downloaded locally: python scripts/download_dataset.py
